<!DOCTYPE html>
<html>
<head><title>Icon Generator</title></head>
<body>
<p>Right-click each canvas below and "Save image as" to the assets/icons/ folder.</p>

<h3>icon16.png</h3>
<canvas id="c16" width="16" height="16"></canvas>

<h3>icon48.png</h3>
<canvas id="c48" width="48" height="48"></canvas>

<h3>icon128.png</h3>
<canvas id="c128" width="128" height="128"></canvas>

<script>
function drawIcon(canvasId, size) {
  const c = document.getElementById(canvasId);
  const ctx = c.getContext('2d');
  const s = size;

  // Background rounded rect
  const r = s * 0.18;
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(s - r, 0);
  ctx.quadraticCurveTo(s, 0, s, r);
  ctx.lineTo(s, s - r);
  ctx.quadraticCurveTo(s, s, s - r, s);
  ctx.lineTo(r, s);
  ctx.quadraticCurveTo(0, s, 0, s - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();

  const gradient = ctx.createLinearGradient(0, 0, s, s);
  gradient.addColorStop(0, '#6c5ce7');
  gradient.addColorStop(1, '#4a3fb5');
  ctx.fillStyle = gradient;
  ctx.fill();

  // Camera/snapshot icon
  ctx.strokeStyle = '#fff';
  ctx.fillStyle = '#fff';
  ctx.lineWidth = Math.max(1, s * 0.06);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // Stacked layers (representing multiple tabs/contexts)
  const cx = s / 2;
  const cy = s / 2;
  const bw = s * 0.45; // box width
  const bh = s * 0.32; // box height

  // Back layer
  ctx.globalAlpha = 0.35;
  ctx.strokeRect(cx - bw/2 + s*0.06, cy - bh/2 - s*0.06, bw, bh);

  // Middle layer
  ctx.globalAlpha = 0.6;
  ctx.strokeRect(cx - bw/2 + s*0.03, cy - bh/2 - s*0.03, bw, bh);

  // Front layer (filled)
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(cx - bw/2, cy - bh/2, bw, bh);
  ctx.strokeStyle = '#fff';
  ctx.strokeRect(cx - bw/2, cy - bh/2, bw, bh);

  // Bookmark/pin indicator in corner
  ctx.fillStyle = '#fdcb6e';
  const dotR = s * 0.06;
  ctx.beginPath();
  ctx.arc(cx + bw/2 - dotR*1.5, cy - bh/2 + dotR*1.5, dotR, 0, Math.PI * 2);
  ctx.fill();
}

drawIcon('c16', 16);
drawIcon('c48', 48);
drawIcon('c128', 128);
</script>
</body>
</html>
