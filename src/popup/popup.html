<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ContextSnap</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <h1 class="logo">ContextSnap</h1>
      <button id="settings-btn" class="btn-icon" title="Settings">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 4.754a3.246 3.246 0 100 6.492 3.246 3.246 0 000-6.492zM5.754 8a2.246 2.246 0 114.492 0 2.246 2.246 0 01-4.492 0z"/>
          <path d="M9.796 1.343c-.527-1.79-3.065-1.79-3.592 0l-.094.319a.873.873 0 01-1.255.52l-.292-.16c-1.64-.892-3.433.902-2.54 2.541l.159.292a.873.873 0 01-.52 1.255l-.319.094c-1.79.527-1.79 3.065 0 3.592l.319.094a.873.873 0 01.52 1.255l-.16.292c-.892 1.64.902 3.434 2.541 2.54l.292-.159a.873.873 0 011.255.52l.094.319c.527 1.79 3.065 1.79 3.592 0l.094-.319a.873.873 0 011.255-.52l.292.16c1.64.893 3.434-.902 2.54-2.541l-.159-.292a.873.873 0 01.52-1.255l.319-.094c1.79-.527 1.79-3.065 0-3.592l-.319-.094a.873.873 0 01-.52-1.255l.16-.292c.893-1.64-.902-3.433-2.541-2.54l-.292.159a.873.873 0 01-1.255-.52l-.094-.319zm-2.633.283c.246-.835 1.428-.835 1.674 0l.094.319a1.873 1.873 0 002.693 1.115l.291-.16c.764-.415 1.6.42 1.184 1.185l-.159.292a1.873 1.873 0 001.116 2.692l.318.094c.835.246.835 1.428 0 1.674l-.319.094a1.873 1.873 0 00-1.115 2.693l.16.291c.415.764-.421 1.6-1.185 1.184l-.291-.159a1.873 1.873 0 00-2.693 1.116l-.094.318c-.246.835-1.428.835-1.674 0l-.094-.319a1.873 1.873 0 00-2.692-1.115l-.292.16c-.764.415-1.6-.421-1.184-1.185l.159-.291A1.873 1.873 0 001.945 8.93l-.319-.094c-.835-.246-.835-1.428 0-1.674l.319-.094A1.873 1.873 0 003.06 4.377l-.16-.292c-.415-.764.421-1.6 1.185-1.184l.292.159a1.873 1.873 0 002.692-1.115l.094-.319z"/>
        </svg>
      </button>
    </header>

    <!-- Save New Context -->
    <div class="save-section">
      <div class="save-row">
        <input
          type="text"
          id="context-name"
          placeholder="Name this context..."
          autocomplete="off"
          spellcheck="false"
        />
        <button id="save-btn" class="btn btn-primary" title="Save current context">
          Save
        </button>
      </div>
      <p class="hint">Ctrl+Shift+S for quick save</p>
    </div>

    <!-- Divider -->
    <div class="divider"></div>

    <!-- Context List -->
    <div id="context-list" class="context-list">
      <!-- Populated by JS -->
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="empty-state" style="display: none;">
      <p class="empty-icon">📸</p>
      <p class="empty-text">No saved contexts yet.</p>
      <p class="empty-hint">Save your first context to get started.</p>
    </div>

    <!-- Loading -->
    <div id="loading" class="loading">
      <div class="spinner"></div>
    </div>

    <!-- Settings Panel (hidden by default) -->
    <div id="settings-panel" class="settings-panel" style="display: none;">
      <div class="settings-header">
        <button id="settings-back" class="btn-icon" title="Back">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path fill-rule="evenodd" d="M11.354 1.646a.5.5 0 010 .708L5.707 8l5.647 5.646a.5.5 0 01-.708.708l-6-6a.5.5 0 010-.708l6-6a.5.5 0 01.708 0z"/>
          </svg>
        </button>
        <h2 class="settings-title">Settings</h2>
      </div>

      <div class="settings-group">
        <div class="settings-group-label">Restore</div>

        <label class="setting-row">
          <div class="setting-label">
            Restore scroll position
            <span class="setting-help" title="Restores where you were scrolled to on each tab. Disable to always start at the top of the page.">?</span>
          </div>
          <input type="checkbox" id="set-restoreScrollPosition" class="toggle">
        </label>

        <label class="setting-row">
          <div class="setting-label">
            Progressive scroll
            <span class="setting-help" title="Automatically scrolls down on infinite-scroll pages (YouTube, Twitter) to load content before restoring your position. May take a few seconds on long pages.">?</span>
          </div>
          <input type="checkbox" id="set-progressiveScroll" class="toggle">
        </label>

        <label class="setting-row">
          <div class="setting-label">
            Restore form data
            <span class="setting-help" title="Re-fills text inputs, dropdowns, checkboxes, and other form fields when restoring a context.">?</span>
          </div>
          <input type="checkbox" id="set-restoreFormData" class="toggle">
        </label>

        <label class="setting-row">
          <div class="setting-label">
            Restore text selections
            <span class="setting-help" title="Re-highlights selected text on each tab when restoring a context.">?</span>
          </div>
          <input type="checkbox" id="set-restoreSelections" class="toggle">
        </label>

        <label class="setting-row">
          <div class="setting-label">
            Open in new window
            <span class="setting-help" title="Opens restored tabs in a new browser window instead of replacing tabs in the current window.">?</span>
          </div>
          <input type="checkbox" id="set-openInNewWindow" class="toggle">
        </label>

      </div>

      <div class="settings-group">
        <div class="settings-group-label">Storage</div>

        <label class="setting-row">
          <div class="setting-label">
            Max saved contexts
            <span class="setting-help" title="Oldest contexts are automatically removed when this limit is reached. Set to 0 for unlimited.">?</span>
          </div>
          <input type="number" id="set-maxContexts" class="setting-input-num" min="0" max="100" step="1">
        </label>

        <label class="setting-row">
          <div class="setting-label">
            Auto-delete after (days)
            <span class="setting-help" title="Contexts older than this many days are removed on next save. Set to 0 to disable.">?</span>
          </div>
          <input type="number" id="set-autoDeleteDays" class="setting-input-num" min="0" max="365" step="1">
        </label>
      </div>

      <div class="settings-group">
        <div class="settings-group-label">UX</div>

        <label class="setting-row">
          <div class="setting-label">
            Show notifications
            <span class="setting-help" title="Shows a brief toast notification when contexts are saved or restored.">?</span>
          </div>
          <input type="checkbox" id="set-showNotifications" class="toggle">
        </label>
      </div>
    </div>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
